# Ubuntu x86_64 build of the cRustDesk device and client variants, derived from build-rustdesk-linux
# in upstream's .github/workflows/flutter-build.yml, but built on the Ubuntu 22.04 runner (upstream: an 18.04 container). Stock-layout .deb repackaged as crustdesk, uploaded as workflow artifacts.
name: Linux build

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-linux-${{ github.ref }}
  # A new dispatch must not kill a run in the middle of the long build.
  cancel-in-progress: false

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RUSTDESK_CUSTOM_CLIENT_PK: ${{ vars.RUSTDESK_CUSTOM_CLIENT_PK }}

jobs:
  check-signing-key:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the custom.txt signing key
        # A malformed key still compiles, and the client would then ignore every custom.txt.
        run: |
          if [ "$(printf '%s' "$RUSTDESK_CUSTOM_CLIENT_PK" | base64 -d 2>/dev/null | wc -c)" != 32 ]; then
            echo "::error::RUSTDESK_CUSTOM_CLIENT_PK must be a base64 Ed25519 public key (32 bytes)"
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the custom.txt files against the key
        # Fails before the long build if the committed custom.txt was signed with another key.
        run: |
          bash res/custom/verify.sh res/custom/rustdesk.txt res/custom/rustdesk.json "$RUSTDESK_CUSTOM_CLIENT_PK"
          bash res/custom/verify.sh res/custom/client.txt res/custom/client.json "$RUSTDESK_CUSTOM_CLIENT_PK"

  generate-bridge:
    needs: [check-signing-key]
    uses: ./.github/workflows/bridge.yml
    with:
      artifact-name: bridge-artifact-linux

  test:
    # A job of its own, so it runs beside the long build.
    needs: [check-signing-key, generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install prerequisites
        # libunwind-dev (for GStreamer) replaces the image's libunwind-14-dev; apt removes that only when asked by name.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libunwind-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            nasm \
            ninja-build \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Restore bridge files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-artifact-linux
          path: ./

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-bincache,read
        run: $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"

      - name: Run the account tests
        run: cargo test --locked --lib --features flutter,unix-file-copy-paste -- hbbs_http::account::tests

  build:
    needs: [check-signing-key, generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo docker system prune -a --volumes -f

      - name: Install prerequisites
        # libunwind-dev (for GStreamer) replaces the image's libunwind-14-dev; apt removes that only when asked by name.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libunwind-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            nasm \
            ninja-build \
            pkg-config
          # we have libopus compiled by us.
          sudo apt-get remove -y libopus-dev || true

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the version
        shell: bash
        # Cargo.toml holds the native clients' version (<upstream>-<n>); the files are named after it.
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-artifact-linux
          path: ./

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Restore the vcpkg binary cache
        id: vcpkg-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-bincache,readwrite
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-linux-rel-out.log" || true
        shell: bash

      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        shell: bash
        run: bash .github/scripts/prune-vcpkg-cache.sh "$RUNNER_TEMP/vcpkg-bincache" "$VCPKG_ROOT/installed"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.key != steps.vcpkg-restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.key }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch flutter
        run: git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Build rustdesk
        run: |
          cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
          rm -rf target/release/deps target/release/build
          export CARGO_INCREMENTAL=0
          export DEB_ARCH=amd64
          python3 ./build.py --flutter --skip-cargo
          for name in rustdesk*??.deb; do
            mv "$name" "${name%%.deb}-x86_64.deb"
          done

      - name: Package the variants
        run: |
          set -euo pipefail
          stock="rustdesk-$VERSION-x86_64.deb"
          bash res/linux/package-variant.sh "$stock" res/custom/rustdesk.txt "crustdesk-$VERSION-x86_64.deb"
          bash res/linux/package-variant.sh "$stock" res/custom/client.txt "crustdesk-client-$VERSION-x86_64.deb" client

      - name: Verify the debs
        run: |
          bash res/linux/check-variant.sh "crustdesk-$VERSION-x86_64.deb" res/custom/rustdesk.txt
          bash res/linux/check-variant.sh "crustdesk-client-$VERSION-x86_64.deb" res/custom/client.txt client

      - name: Upload crustdesk deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crustdesk-linux-x86_64-deb
          path: crustdesk-${{ env.VERSION }}-x86_64.deb
          retention-days: 30

      - name: Upload crustdesk client deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crustdesk-client-linux-x86_64-deb
          path: crustdesk-client-${{ env.VERSION }}-x86_64.deb
          retention-days: 30
