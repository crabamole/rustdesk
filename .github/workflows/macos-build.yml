# macOS arm64 build of the cRustDesk device and client variants, derived from build-for-macOS
# in upstream's .github/workflows/flutter-build.yml. Signed, notarized and stapled apps zipped as workflow artifacts.
name: macOS build

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-macos-${{ github.ref }}
  # A new dispatch must not kill a run in the middle of notarization.
  cancel-in-progress: false

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RUSTDESK_CUSTOM_CLIENT_PK: ${{ vars.RUSTDESK_CUSTOM_CLIENT_PK }}

jobs:
  check-signing-key:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the custom.txt signing key
        # A malformed key still compiles, and the client would then ignore every custom.txt.
        run: |
          if [ "$(printf '%s' "$RUSTDESK_CUSTOM_CLIENT_PK" | base64 -d 2>/dev/null | wc -c)" != 32 ]; then
            echo "::error::RUSTDESK_CUSTOM_CLIENT_PK must be a base64 Ed25519 public key (32 bytes)"
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the custom.txt files against the key
        # Fails before the long build if the committed custom.txt was signed with another key.
        run: |
          bash res/custom/verify.sh res/custom/rustdesk.txt res/custom/rustdesk.json "$RUSTDESK_CUSTOM_CLIENT_PK"
          bash res/custom/verify.sh res/custom/client.txt res/custom/client.json "$RUSTDESK_CUSTOM_CLIENT_PK"

  generate-bridge:
    needs: [check-signing-key]
    uses: ./.github/workflows/bridge.yml
    with:
      artifact-name: bridge-artifact-macos

  build:
    needs: [check-signing-key, generate-bridge]
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the version
        shell: bash
        # Cargo.toml holds the native clients' version (<upstream>-<n>); the files are named after it.
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Import the codesign cert
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: rustdesk

      - name: Check sign and import sign key
        run: |
          security default-keychain -s rustdesk.keychain
          security find-identity -v

      - name: Import notarize key
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2
        with:
          # https://gregoryszorc.com/docs/apple-codesign/stable/apple_codesign_rcodesign.html#notarizing-and-stapling
          fileName: notarize.json
          fileDir: ${{ runner.temp }}
          encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}

      - name: Install rcodesign tool
        shell: bash
        run: |
          pushd /tmp
          wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
          tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz
          mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
          popd

      - name: Install build runtime
        run: |
          brew install llvm
          # The runner image may already ship pkg-config.
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        # brew installs NASM 3.x, whose CLI is incompatible with the multimedia libraries' build.
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          prefix-key: macos-15

      - name: Restore bridge files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-artifact-macos
          path: ./

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-bincache,readwrite
        run: |
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Prune the vcpkg binary cache
        id: vcpkg-cache
        shell: bash
        run: bash .github/scripts/prune-vcpkg-cache.sh "$RUNNER_TEMP/vcpkg-bincache" "$VCPKG_ROOT/installed"

      - name: Save the vcpkg binary cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.key }}

      - name: Build rustdesk
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Package the variants
        # Both variants share app name and bundle ID, so each gets its own output dir.
        run: |
          src=./flutter/build/macos/Build/Products/Release/RustDesk.app
          bash res/macos/package-variant.sh "$src" res/custom/rustdesk.txt cRustDesk io.github.crabamole.crustdesk dist/dc
          bash res/macos/package-variant.sh "$src" res/custom/client.txt cRustDesk io.github.crabamole.crustdesk dist/client

      - name: Codesign, notarize and zip the apps
        env:
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARIZE_KEY: ${{ runner.temp }}/notarize.json
        run: |
          set -euo pipefail
          security default-keychain -s rustdesk.keychain
          security unlock-keychain -p "$MACOS_P12_PASSWORD" rustdesk.keychain
          for variant in dc client; do
            app="dist/$variant/cRustDesk.app"
            zip="dist/$variant/notarize.zip"
            bash .github/scripts/sign-macos-app.sh "$app" "$MACOS_CODESIGN_IDENTITY" flutter/macos/Runner/Release.entitlements
            ditto -c -k --keepParent "$app" "$zip"
            # A zip cannot hold a ticket: notarize the zip, staple the app, then zip again.
            rcodesign notary-submit --api-key-path "$NOTARIZE_KEY" --wait "$zip"
            # The ticket can take a moment to become fetchable after acceptance.
            for i in 1 2 3; do xcrun stapler staple "$app" && break; sleep 30; done
            xcrun stapler validate "$app"
            rm "$zip"
          done
          ditto -c -k --keepParent dist/dc/cRustDesk.app "dist/cRustDesk-$VERSION-aarch64.zip"
          ditto -c -k --keepParent dist/client/cRustDesk.app "dist/cRustDesk-client-$VERSION-aarch64.zip"

      - name: Verify the zips
        run: |
          set -euo pipefail
          check() {
            local zip=$1 custom=$2
            local dir
            dir=$(mktemp -d "$RUNNER_TEMP/verify.XXXXXX")
            ditto -x -k "$zip" "$dir"
            local app="$dir/cRustDesk.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vv -t exec "$app" 2>&1 | tee "$dir/spctl.txt"
            grep -q 'source=Notarized Developer ID' "$dir/spctl.txt"
            xcrun stapler validate "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.crabamole.crustdesk
            cmp "$app/Contents/Resources/custom.txt" "$custom"
            local ents
            ents=$(codesign -d --entitlements :- "$app" 2>/dev/null)
            test "$(plutil -extract 'com\.apple\.security\.device\.audio-input' raw - <<<"$ents")" = true
            echo "OK $zip"
          }
          check "dist/cRustDesk-$VERSION-aarch64.zip" res/custom/rustdesk.txt
          check "dist/cRustDesk-client-$VERSION-aarch64.zip" res/custom/client.txt

      - name: Upload cRustDesk zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cRustDesk-macos-aarch64
          path: dist/cRustDesk-${{ env.VERSION }}-aarch64.zip
          retention-days: 30

      - name: Upload cRustDesk client zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cRustDesk-client-macos-aarch64
          path: dist/cRustDesk-client-${{ env.VERSION }}-aarch64.zip
          retention-days: 30
