# Releases the native clients under the tag <version>, the version in Cargo.toml (<upstream>-<n>).
# This workflow builds the installers, creates the GitHub Release (and its tag) once all of them
# exist, then publishes them as an image (installers-image.yml). The web client has its own version
# and release (web-docker.yml). A dispatch on any branch is a dry run.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check if this version is released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Release only on a definite "not found"; any other lookup error fails the job.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" 2>&1); then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<<"$out"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      # publish needs this section; fail here, before the builds and the signing.
      - name: Check the release notes
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f = 1; next} /^## / {f = 0} f' docs/release-notes.md > section.md
          [ -s section.md ] || { echo "docs/release-notes.md has no section for $VERSION"; exit 1; }

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-build.yml
    with:
      sign: ${{ needs.version.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    secrets: inherit

  linux:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/linux-build.yml
    secrets: inherit

  macos:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/macos-build.yml
    secrets: inherit

  publish:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: c*
          merge-multiple: true

      - name: Check the installers
        working-directory: dist
        run: |
          ls -l
          [ "$(ls | grep -c -- "-$VERSION-")" = 6 ] || { echo "expected 6 installers"; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate the SBOM
        run: |
          # CycloneDX inventory of the locked dependencies (Cargo, pub, yarn, vcpkg) of this commit.
          docker run --rm -v "$PWD:/src:ro" \
            anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            dir:/src --exclude ./dist --source-name cRustDesk --source-version "$VERSION" \
            -o cyclonedx-json=/dev/stdout -q > "dist/cRustDesk-$VERSION.cdx.json"
          (cd dist && sha256sum "cRustDesk-$VERSION.cdx.json" >> SHA256SUMS)
          jq -e '.components | length > 1000' "dist/cRustDesk-$VERSION.cdx.json"

      - name: Attest the installers
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.msi
            dist/*.zip
            dist/*.deb
            dist/*.cdx.json

      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          Installers image: \`ghcr.io/crabamole/rustdesk/installers:$VERSION\`

          Installers for the device (\`cRustDesk\`) and client-only (\`cRustDesk-client\`) variants.
          The Windows MSIs and their programs are code-signed by "Open Source Developer Rophy Tsai" (Certum).
          Verify a download: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`
          SBOM (CycloneDX): \`cRustDesk-$VERSION.cdx.json\`
          Deployment guide: [docs/crustdesk-deployment.md](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/crustdesk-deployment.md)
          EOF
          awk -v v="## $VERSION" '$0 == v {f = 1; next} /^## / {f = 0} f' docs/release-notes.md > section.md
          [ -s section.md ] || { echo "docs/release-notes.md has no section for $VERSION"; exit 1; }
          { echo; cat section.md; } >> notes.md
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "cRustDesk $VERSION" --notes-file notes.md

  installers-image:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/installers-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
