# Windows x64 client build, derived from build-for-windows-flutter in upstream's .github/workflows/flutter-build.yml.
# Builds the cRustDesk device and client variants as MSIs, uploaded as workflow artifacts.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign on the code-signing runner (branches allowed by the codesign environments only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RUSTDESK_CUSTOM_CLIENT_PK: ${{ vars.RUSTDESK_CUSTOM_CLIENT_PK }}

jobs:
  check-signing-key:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the custom.txt signing key
        # A malformed key still compiles, and the client would then ignore every custom.txt.
        run: |
          if [ "$(printf '%s' "$RUSTDESK_CUSTOM_CLIENT_PK" | base64 -d 2>/dev/null | wc -c)" != 32 ]; then
            echo "::error::RUSTDESK_CUSTOM_CLIENT_PK must be a base64 Ed25519 public key (32 bytes)"
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify the custom.txt files against the key
        # Fails before the long build if the committed custom.txt was signed with another key.
        run: |
          bash res/custom/verify.sh res/custom/rustdesk.txt res/custom/rustdesk.json "$RUSTDESK_CUSTOM_CLIENT_PK"
          bash res/custom/verify.sh res/custom/client.txt res/custom/client.json "$RUSTDESK_CUSTOM_CLIENT_PK"

  generate-bridge:
    needs: [check-signing-key]
    uses: ./.github/workflows/bridge.yml
    with:
      artifact-name: bridge-artifact-windows

  build-RustDeskTempTopMostWindow:
    needs: [check-signing-key]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build:
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Read the version
        shell: bash
        # Cargo.toml holds the native clients' version (<upstream>-<n>); the files are named after it.
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-windows
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver, prebuilt and signed by RustDesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Package the variants
        # Both variants share the app name, so each gets its own folder.
        run: |
          pwsh res/windows/package-variant.ps1 -Src ./rustdesk -CustomTxt res/custom/rustdesk.txt -AppName cRustDesk -Out ./dist/dc
          pwsh res/windows/package-variant.ps1 -Src ./rustdesk -CustomTxt res/custom/client.txt -AppName cRustDesk -Out ./dist/client

      - name: Upload the files to sign
        if: inputs.sign
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dist
          path: dist
          retention-days: 1

      - name: Add MSBuild to PATH
        if: ${{ !inputs.sign }}
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build the MSIs
        if: ${{ !inputs.sign }}
        run: |
          mkdir SignOutput
          $variants = @(
            @{ Dist = 'dc'; Prefix = 'cRustDesk'; Extra = @() },
            @{ Dist = 'client'; Prefix = 'cRustDesk-client'; Extra = @('--conn-type', 'outgoing') }
          )
          foreach ($v in $variants) {
            pushd ./res/msi
            git checkout -- .   # preprocess.py edits the WiX sources in place; start each variant clean
            python preprocess.py --arp --custom --app-name cRustDesk -m crabamole @($v.Extra) -d ../../dist/$($v.Dist)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # MSBuild hard-links obj to bin, so a reused obj would rewrite the earlier variant's MSI.
            Remove-Item -Recurse -Force ./Package/bin, ./Package/obj -ErrorAction SilentlyContinue
            nuget restore msi.sln
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
            Copy-Item $msi.FullName ../../SignOutput/$($v.Prefix)-${{ env.VERSION }}-x86_64.msi
            popd
          }
          sha256sum ./SignOutput/*.msi
          $hashes = Get-ChildItem SignOutput/*.msi | ForEach-Object { (Get-FileHash $_).Hash }
          if (($hashes | Select-Object -Unique).Count -ne $hashes.Count) { throw "the variant MSIs are identical" }

      - name: Verify the MSIs
        if: ${{ !inputs.sign }}
        run: |
          function Check($msi, $custom) {
            $target = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            $p = Start-Process msiexec -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec failed for ${msi}: $($p.ExitCode)" }
            $exe = Get-ChildItem $target -Recurse -Filter cRustDesk.exe | Select-Object -First 1
            if (-not $exe) { throw "cRustDesk.exe missing in $msi" }
            $dir = $exe.Directory
            if ($dir.Name -ne 'cRustDesk') { throw "unexpected install folder $($dir.FullName)" }
            if ((Get-FileHash (Join-Path $dir 'custom.txt')).Hash -ne (Get-FileHash $custom).Hash) { throw "custom.txt differs in $msi" }
            $vi = $exe.VersionInfo
            if ($vi.CompanyName -ne 'crabamole' -or $vi.ProductName -ne 'cRustDesk' -or $vi.OriginalFilename -ne 'rustdesk.exe') {
              throw "unexpected version info: $($vi.CompanyName) / $($vi.ProductName) / $($vi.OriginalFilename)"
            }
            if ((Get-ChildItem $target -Recurse -Filter printer_driver_adapter.dll) -or (Get-ChildItem $target -Recurse -Directory -Filter RustDeskPrinterDriver)) { throw "printer files shipped in $msi" }
            Write-Output "OK $msi"
          }
          Check (Resolve-Path SignOutput/cRustDesk-${{ env.VERSION }}-x86_64.msi).Path (Resolve-Path res/custom/rustdesk.txt).Path
          Check (Resolve-Path SignOutput/cRustDesk-client-${{ env.VERSION }}-x86_64.msi).Path (Resolve-Path res/custom/client.txt).Path

      - name: Upload cRustDesk msi
        if: ${{ !inputs.sign }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cRustDesk-windows-x86_64-msi
          path: SignOutput/cRustDesk-${{ env.VERSION }}-x86_64.msi
          retention-days: 30

      - name: Upload cRustDesk client msi
        if: ${{ !inputs.sign }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cRustDesk-client-windows-x86_64-msi
          path: SignOutput/cRustDesk-client-${{ env.VERSION }}-x86_64.msi
          retention-days: 30

  start-signer:
    if: inputs.sign
    needs: [check-signing-key]
    runs-on: ubuntu-24.04
    environment: codesign-approve
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CODESIGN_AWS_ROLE }}
          aws-region: ${{ secrets.CODESIGN_AWS_REGION }}
          mask-aws-account-id: true

      - name: Start the signing machine
        env:
          INSTANCE: ${{ secrets.CODESIGN_INSTANCE_ID }}
        run: |
          aws ec2 start-instances --instance-ids "$INSTANCE" > /dev/null
          aws ec2 wait instance-running --instance-ids "$INSTANCE"
          echo "::notice::The signing machine is up. Unlock SimplySign with sign-unlock."

  sign-files:
    if: inputs.sign
    needs: [build, start-signer]
    runs-on: [self-hosted, codesign]
    environment: codesign
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      THUMBPRINT: 6C7C687E56E18B5FDB47EF52BCAEE74751CFBA79
      SIGNTOOL: C:\codesign\bin\signtool.exe
    steps:
      - name: Clean the workspace
        run: Get-ChildItem -Force | Remove-Item -Recurse -Force

      - name: Download the files to sign
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dist
          path: dist

      - name: Wait for the SimplySign session
        # The certificate is in the store also before the login. The unlock writes the ready
        # file after a test signature works.
        run: |
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          for ($i = 0; $i -lt 360; $i++) {
            $ready = Get-Item C:\codesign\unlock\ready -ErrorAction SilentlyContinue
            if ($ready -and $ready.LastWriteTime -gt $boot) { exit 0 }
            if ($i % 30 -eq 0) { "waiting for sign-unlock ($($i / 6) min)" }
            Start-Sleep 10
          }
          throw 'no SimplySign session within 60 minutes'

      - name: Sign the unsigned programs
        run: |
          $files = Get-ChildItem dist -Recurse -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' }
          if (-not $files) { throw 'nothing to sign' }
          "signing $(@($files).Count) files"
          & $env:SIGNTOOL sign /sha1 $env:THUMBPRINT /fd sha256 /tr http://time.certum.pl /td sha256 $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the programs
        # Every program but the prebuilt display driver carries our signature. Windows trusts the
        # driver through its catalog, which Microsoft signs; its DLL has only a test signature.
        run: |
          $files = Get-ChildItem dist -Recurse -Include *.exe, *.dll |
            Where-Object FullName -notmatch '\\usbmmidd_v2\\'
          & $env:SIGNTOOL verify /pa /q $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.FullName): $($s.Status)" }
            if ($s.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) {
              throw "$($f.FullName): signed by $($s.SignerCertificate.Subject)"
            }
          }
          "verified $(@($files).Count) files"

      - name: Upload the signed files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dist-signed
          path: dist
          retention-days: 1

  msi-signed:
    if: inputs.sign
    needs: [sign-files]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read the version
        shell: bash
        # Cargo.toml holds the native clients' version (<upstream>-<n>); the files are named after it.
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Download the signed files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dist-signed
          path: dist

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # Same as "Build the MSIs" and "Verify the MSIs" in job build.
      - name: Build the MSIs
        run: |
          mkdir SignOutput
          $variants = @(
            @{ Dist = 'dc'; Prefix = 'cRustDesk'; Extra = @() },
            @{ Dist = 'client'; Prefix = 'cRustDesk-client'; Extra = @('--conn-type', 'outgoing') }
          )
          foreach ($v in $variants) {
            pushd ./res/msi
            git checkout -- .   # preprocess.py edits the WiX sources in place; start each variant clean
            python preprocess.py --arp --custom --app-name cRustDesk -m crabamole @($v.Extra) -d ../../dist/$($v.Dist)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # MSBuild hard-links obj to bin, so a reused obj would rewrite the earlier variant's MSI.
            Remove-Item -Recurse -Force ./Package/bin, ./Package/obj -ErrorAction SilentlyContinue
            nuget restore msi.sln
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
            Copy-Item $msi.FullName ../../SignOutput/$($v.Prefix)-${{ env.VERSION }}-x86_64.msi
            popd
          }
          sha256sum ./SignOutput/*.msi
          $hashes = Get-ChildItem SignOutput/*.msi | ForEach-Object { (Get-FileHash $_).Hash }
          if (($hashes | Select-Object -Unique).Count -ne $hashes.Count) { throw "the variant MSIs are identical" }

      - name: Verify the MSIs
        run: |
          function Check($msi, $custom) {
            $target = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            $p = Start-Process msiexec -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec failed for ${msi}: $($p.ExitCode)" }
            $exe = Get-ChildItem $target -Recurse -Filter cRustDesk.exe | Select-Object -First 1
            if (-not $exe) { throw "cRustDesk.exe missing in $msi" }
            $dir = $exe.Directory
            if ($dir.Name -ne 'cRustDesk') { throw "unexpected install folder $($dir.FullName)" }
            if ((Get-FileHash (Join-Path $dir 'custom.txt')).Hash -ne (Get-FileHash $custom).Hash) { throw "custom.txt differs in $msi" }
            $vi = $exe.VersionInfo
            if ($vi.CompanyName -ne 'crabamole' -or $vi.ProductName -ne 'cRustDesk' -or $vi.OriginalFilename -ne 'rustdesk.exe') {
              throw "unexpected version info: $($vi.CompanyName) / $($vi.ProductName) / $($vi.OriginalFilename)"
            }
            if ((Get-ChildItem $target -Recurse -Filter printer_driver_adapter.dll) -or (Get-ChildItem $target -Recurse -Directory -Filter RustDeskPrinterDriver)) { throw "printer files shipped in $msi" }
            Write-Output "OK $msi"
          }
          Check (Resolve-Path SignOutput/cRustDesk-${{ env.VERSION }}-x86_64.msi).Path (Resolve-Path res/custom/rustdesk.txt).Path
          Check (Resolve-Path SignOutput/cRustDesk-client-${{ env.VERSION }}-x86_64.msi).Path (Resolve-Path res/custom/client.txt).Path

      - name: Upload the MSIs to sign
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-unsigned
          path: SignOutput/*.msi
          retention-days: 1

  sign-msi:
    if: inputs.sign
    needs: [msi-signed]
    runs-on: [self-hosted, codesign]
    environment: codesign
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      THUMBPRINT: 6C7C687E56E18B5FDB47EF52BCAEE74751CFBA79
      SIGNTOOL: C:\codesign\bin\signtool.exe
    steps:
      - name: Clean the workspace
        run: Get-ChildItem -Force | Remove-Item -Recurse -Force

      - name: Download the MSIs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msi-unsigned
          path: SignOutput

      - name: Sign and verify the MSIs
        run: |
          $files = Get-ChildItem SignOutput/*.msi
          if (@($files).Count -ne 2) { throw "expected 2 MSIs, found $(@($files).Count)" }
          & $env:SIGNTOOL sign /sha1 $env:THUMBPRINT /fd sha256 /tr http://time.certum.pl /td sha256 $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:SIGNTOOL verify /pa /q $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) { throw "$($f.Name): $($s.Status)" }
          }

      - name: Upload cRustDesk msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cRustDesk-windows-x86_64-msi
          path: SignOutput/cRustDesk-[0-9]*-x86_64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload cRustDesk client msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cRustDesk-client-windows-x86_64-msi
          path: SignOutput/cRustDesk-client-*-x86_64.msi
          if-no-files-found: error
          retention-days: 30

  stop-signer:
    if: always() && needs.start-signer.result == 'success'
    needs: [start-signer, sign-files, sign-msi]
    runs-on: ubuntu-24.04
    environment: codesign
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CODESIGN_AWS_ROLE }}
          aws-region: ${{ secrets.CODESIGN_AWS_REGION }}
          mask-aws-account-id: true

      - name: Stop the signing machine
        env:
          INSTANCE: ${{ secrets.CODESIGN_INSTANCE_ID }}
        run: aws ec2 stop-instances --instance-ids "$INSTANCE" > /dev/null
