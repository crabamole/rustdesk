# Windows x64 client build, derived from build-for-windows-flutter in workflows-archive/flutter-build.yml.
# Builds the cRustDesk device and client variants as MSIs, uploaded as workflow artifacts.
name: Windows build

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  RUSTDESK_CUSTOM_CLIENT_PK: ${{ vars.RUSTDESK_CUSTOM_CLIENT_PK }}
  # Off until a code-signing certificate exists.
  HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 != '' }}

jobs:
  check-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check the custom.txt signing key
        # A malformed key still compiles, and the client would then ignore every custom.txt.
        run: |
          if [ "$(printf '%s' "$RUSTDESK_CUSTOM_CLIENT_PK" | base64 -d 2>/dev/null | wc -c)" != 32 ]; then
            echo "::error::RUSTDESK_CUSTOM_CLIENT_PK must be a base64 Ed25519 public key (32 bytes)"
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify the custom.txt files against the key
        # Fails before the long build if the committed custom.txt was signed with another key.
        run: |
          bash res/custom/verify.sh res/custom/rustdesk.txt res/custom/rustdesk.json "$RUSTDESK_CUSTOM_CLIENT_PK"
          bash res/custom/verify.sh res/custom/client.txt res/custom/client.json "$RUSTDESK_CUSTOM_CLIENT_PK"

  generate-bridge:
    needs: [check-signing-key]
    uses: ./.github/workflows/bridge.yml
    with:
      artifact-name: bridge-artifact-windows

  build-RustDeskTempTopMostWindow:
    needs: [check-signing-key]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build:
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-windows
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver, prebuilt and signed by RustDesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Package the variants
        # Both variants share the app name, so each gets its own folder.
        run: |
          pwsh res/windows/package-variant.ps1 -Src ./rustdesk -CustomTxt res/custom/rustdesk.txt -AppName cRustDesk -Out ./dist/dc
          pwsh res/windows/package-variant.ps1 -Src ./rustdesk -CustomTxt res/custom/client.txt -AppName cRustDesk -Out ./dist/client

      - name: Import the signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}

      - name: Sign the app files
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          $files = Get-ChildItem dist/*/cRustDesk.exe, dist/*/*.dll
          & $env:SIGNTOOL sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:PFX_PASSWORD $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build the MSIs
        run: |
          mkdir SignOutput
          $variants = @(
            @{ Dist = 'dc'; Prefix = 'cRustDesk'; Extra = @() },
            @{ Dist = 'client'; Prefix = 'cRustDesk-client'; Extra = @('--conn-type', 'outgoing') }
          )
          foreach ($v in $variants) {
            pushd ./res/msi
            git checkout -- .   # preprocess.py edits the WiX sources in place; start each variant clean
            python preprocess.py --arp --custom --app-name cRustDesk -m crabamole @($v.Extra) -d ../../dist/$($v.Dist)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # MSBuild hard-links obj to bin, so a reused obj would rewrite the earlier variant's MSI.
            Remove-Item -Recurse -Force ./Package/bin, ./Package/obj -ErrorAction SilentlyContinue
            nuget restore msi.sln
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
            Copy-Item $msi.FullName ../../SignOutput/$($v.Prefix)-${{ env.VERSION }}-x86_64.msi
            popd
          }
          sha256sum ./SignOutput/*.msi
          $hashes = Get-ChildItem SignOutput/*.msi | ForEach-Object { (Get-FileHash $_).Hash }
          if (($hashes | Select-Object -Unique).Count -ne $hashes.Count) { throw "the variant MSIs are identical" }

      - name: Sign the MSIs
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          $files = Get-ChildItem SignOutput/*.msi
          & $env:SIGNTOOL sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:PFX_PASSWORD $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}

      - name: Verify the MSIs
        run: |
          function Check($msi, $custom) {
            $target = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            $p = Start-Process msiexec -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec failed for ${msi}: $($p.ExitCode)" }
            $exe = Get-ChildItem $target -Recurse -Filter cRustDesk.exe | Select-Object -First 1
            if (-not $exe) { throw "cRustDesk.exe missing in $msi" }
            $dir = $exe.Directory
            if ($dir.Name -ne 'cRustDesk') { throw "unexpected install folder $($dir.FullName)" }
            if ((Get-FileHash (Join-Path $dir 'custom.txt')).Hash -ne (Get-FileHash $custom).Hash) { throw "custom.txt differs in $msi" }
            $vi = $exe.VersionInfo
            if ($vi.CompanyName -ne 'crabamole' -or $vi.ProductName -ne 'cRustDesk' -or $vi.OriginalFilename -ne 'rustdesk.exe') {
              throw "unexpected version info: $($vi.CompanyName) / $($vi.ProductName) / $($vi.OriginalFilename)"
            }
            if ((Get-ChildItem $target -Recurse -Filter printer_driver_adapter.dll) -or (Get-ChildItem $target -Recurse -Directory -Filter RustDeskPrinterDriver)) { throw "printer files shipped in $msi" }
            Write-Output "OK $msi"
          }
          Check (Resolve-Path SignOutput/cRustDesk-${{ env.VERSION }}-x86_64.msi).Path (Resolve-Path res/custom/rustdesk.txt).Path
          Check (Resolve-Path SignOutput/cRustDesk-client-${{ env.VERSION }}-x86_64.msi).Path (Resolve-Path res/custom/client.txt).Path

      - name: Upload cRustDesk msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cRustDesk-windows-x86_64-msi
          path: SignOutput/cRustDesk-${{ env.VERSION }}-x86_64.msi
          retention-days: 30

      - name: Upload cRustDesk client msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cRustDesk-client-windows-x86_64-msi
          path: SignOutput/cRustDesk-client-${{ env.VERSION }}-x86_64.msi
          retention-days: 30
