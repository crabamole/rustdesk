name: Web client CI

on:
  pull_request:
    paths:
      - 'flutter/web/**'
      - 'flutter/lib/**'
      - 'flutter/assets/**'
      - 'flutter/pubspec.*'
      - 'src/lang/**'
      - 'docker/web-client/**'
      - '.github/workflows/web-docker.yml'
      - '.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff'
  push:
    branches: [master]
    paths:
      - 'flutter/web/**'
      - 'flutter/lib/**'
      - 'flutter/assets/**'
      - 'flutter/pubspec.*'
      - 'src/lang/**'
      - 'docker/web-client/**'
      - '.github/workflows/web-docker.yml'
      - '.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/crabamole/rustdesk/web-client

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check the version matches upstream RustDesk
        run: |
          # flutter/web/js/package.json holds <upstream RustDesk version>-<our build number>.
          version=$(jq -r .version flutter/web/js/package.json)
          upstream=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [[ "$version" =~ ^${upstream//./\\.}-[0-9]+$ ]] || { echo "package.json version $version must be $upstream-<n>"; exit 1; }

      - name: Install and test
        working-directory: flutter/web/js
        run: |
          yarn install
          python3 ./gen_js_from_hbb.py > src/gen_js_from_hbb.ts
          python3 ./ts_proto.py
          yarn test

  build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check if this version is published
        id: check
        run: |
          version=$(jq -r .version flutter/web/js/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != push ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          # Publish only on a definite "not found"; any other lookup error fails the job.
          elif out=$(docker manifest inspect "$IMAGE_NAME:$version" 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|no such manifest|not found' <<<"$out"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web-client/Dockerfile
          push: ${{ steps.check.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
