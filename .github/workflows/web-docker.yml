name: Web client CI

on:
  pull_request:
    paths:
      - 'flutter/web/**'
      - 'flutter/lib/**'
      - 'flutter/assets/**'
      - 'flutter/pubspec.*'
      - 'docker/web-client/**'
      - '.github/workflows/web-docker.yml'
      - '.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff'
  push:
    branches: [master]
    paths:
      - 'flutter/web/**'
      - 'flutter/lib/**'
      - 'flutter/assets/**'
      - 'flutter/pubspec.*'
      - 'docker/web-client/**'
      - '.github/workflows/web-docker.yml'
      - '.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff'
    tags: ['web-client-*']
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/crabamole/rustdesk/web-client

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install and test
        working-directory: flutter/web/js
        run: |
          yarn install
          python3 ./gen_js_from_hbb.py > src/gen_js_from_hbb.ts
          python3 ./ts_proto.py
          yarn test

  build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=web-client-(.+),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web-client/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
